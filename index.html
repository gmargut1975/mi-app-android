<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Hitz Jokoa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen phone game; app column max 480px, sticky top bar, fixed bottom tab bar */
:root{
  --bg:#e9f0eb; --surface:#ffffff; --surface2:#dde8e1; --ink:#0f2a21; --muted:#56706a;
  --accent:#1d7a50; --accent-ink:#ffffff; --accent-deep:#135c3b;
  --red:#cf3a2f; --red-soft:#fbe3df; --good-soft:#d8f1e2; --gold:#e3a72f; --line:#c9d8cf;
  --display:"Fredoka","Baloo 2",ui-rounded,system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 3px 0 var(--line);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1c17; --surface:#142b23; --surface2:#1c382e; --ink:#e6f2ec; --muted:#93ada4;
  --accent:#3fb27a; --accent-ink:#06160f; --accent-deep:#2a8a5b;
  --red:#ef6a5c; --red-soft:#3a1d1a; --good-soft:#163d2b; --gold:#f0bd4f; --line:#0a1612;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0c1c17; --surface:#142b23; --surface2:#1c382e; --ink:#e6f2ec; --muted:#93ada4;
  --accent:#3fb27a; --accent-ink:#06160f; --accent-deep:#2a8a5b;
  --red:#ef6a5c; --red-soft:#3a1d1a; --good-soft:#163d2b; --gold:#f0bd4f; --line:#0a1612;
  color-scheme:dark;}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;font-weight:600}
.sub{color:var(--muted);font-size:14px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand svg{width:36px;height:36px;flex:none}
.brand h1{font-size:24px;letter-spacing:.01em}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}
.pill svg{width:18px;height:18px}

/* level */
.level{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.level-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.level-row strong{font-family:var(--display);font-size:20px;font-weight:600}
.bar{height:12px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .5s ease}

/* modes */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:128px;background:var(--surface);box-shadow:0 4px 0 var(--line);transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.mode .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface2);color:var(--accent)}
.mode .ic svg{width:24px;height:24px}
.mode b{font-family:var(--display);font-size:20px;font-weight:600}
.mode span{font-size:13px;color:var(--muted);line-height:1.35}
.mode.hero{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep);min-height:0;flex-direction:row;align-items:center;gap:14px}
.mode.hero .ic{background:rgba(255,255,255,.18);color:var(--accent-ink)}
.mode.hero span{color:inherit;opacity:.85}
.mode.hero:active{box-shadow:0 4px 0 var(--accent-deep);transform:none}
.mode.hero>button:active{transform:translateY(2px)}
.seg.dark{background:rgba(0,0,0,.18)}
.seg.dark button{color:inherit;opacity:.8}
.seg.dark button[aria-pressed="true"]{background:var(--accent-ink);color:var(--accent);opacity:1;box-shadow:none}
.clock{font-family:var(--display);font-size:56px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.clock.warn{color:var(--red);animation:pulse .5s infinite alternate}
@keyframes pulse{to{transform:scale(1.12)}}
.tbar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.tbar>i{display:block;height:100%;width:100%;background:var(--accent);border-radius:999px}
.tbar>i.warn{background:var(--red)}
.tag{display:inline-block;padding:2px 10px;margin:2px 0;border-radius:999px;background:var(--surface);font-weight:600;font-size:15px}
.tag.hit{background:var(--accent);color:var(--accent-ink)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-inline:-4px;padding-inline:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;background:var(--surface);font-weight:600;font-size:14px;box-shadow:var(--shadow);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip small{opacity:.6;font-weight:500;margin-left:4px}
.seg{display:flex;background:var(--surface2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:10px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:480px;margin:0 auto;display:flex}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 12px;font-size:12px;font-weight:700;color:var(--muted)}
.tabs button svg{width:26px;height:26px}
.tabs button[aria-current="page"]{color:var(--accent)}

/* game */
.game{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.game-in{max-width:480px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 16px;min-height:0}
.ghead{display:flex;align-items:center;gap:12px}
.ghead .bar{flex:1;height:14px}
.x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.x svg{width:24px;height:24px}
.hearts{display:flex;gap:2px;color:var(--red)}
.hearts svg{width:22px;height:22px}
.hearts .off{color:var(--surface2)}
.combo{font-family:var(--display);font-weight:600;color:var(--gold);font-size:15px;min-height:20px;text-align:center}
.prompt{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center;min-height:0}
.prompt .q{font-family:var(--display);font-size:clamp(30px,9vw,42px);font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.prompt .q.long{font-size:clamp(22px,6.4vw,28px);line-height:1.25}
.prompt .q .gap{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--accent);color:var(--accent)}
.opts{display:grid;gap:10px}
.opt{background:var(--surface);border-radius:16px;padding:16px;font-size:18px;font-weight:600;box-shadow:0 4px 0 var(--line);text-align:center;transition:transform .08s;overflow-wrap:anywhere}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt.ok{background:var(--good-soft);box-shadow:0 4px 0 var(--accent);color:var(--ink)}
.opt.bad{background:var(--red-soft);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.big{width:100%;padding:16px;border-radius:16px;font-family:var(--display);font-size:20px;font-weight:600;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 var(--accent-deep)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accent-deep)}
.big.ghost{background:var(--surface);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.big.danger{background:var(--red);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--red) 60%,#000)}
.big:disabled{opacity:.45}
.sheet{border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;animation:up .22s ease-out}
.sheet.ok{background:var(--good-soft)}
.sheet.bad{background:var(--red-soft)}
.sheet h3{font-size:22px}
.sheet.ok h3{color:var(--accent)}
.sheet.bad h3{color:var(--red)}
.sheet p{margin:0;line-height:1.45}
.sheet .ex{font-style:italic;color:var(--muted);font-size:14px}
@keyframes up{from{transform:translateY(20px);opacity:.3}}

/* flashcard */
.card-wrap{flex:1;perspective:1200px;display:flex;min-height:240px}
.fcard{flex:1;position:relative;transform-style:preserve-3d;transition:transform .45s;border-radius:24px}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;background:var(--surface);box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 0 var(--accent-deep)}
.face .w{font-family:var(--display);font-size:clamp(28px,8vw,40px);font-weight:600;line-height:1.15;overflow-wrap:anywhere}
.face .tap{font-size:13px;color:var(--muted)}
.face.back .tap,.face.back .exb{color:inherit;opacity:.85}
.exb{font-style:italic;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* write */
.inp{width:100%;padding:16px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font-size:20px;font-family:var(--body);text-align:center}
.hint{font-family:ui-monospace,Menlo,monospace;letter-spacing:.2em;color:var(--muted);font-size:18px}

/* sections */
.panel{background:var(--surface);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
label{font-size:13px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.field{width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:500}
textarea.field{min-height:110px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--surface2)}
.li:last-child{border-bottom:0}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:700;overflow-wrap:anywhere}
.li .t span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.del{padding:8px 12px;border-radius:10px;font-size:13px;font-weight:700;color:var(--red);background:var(--red-soft)}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:40;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.dots{display:flex;gap:3px}
.dots i{width:8px;height:8px;border-radius:2px;background:var(--surface2)}
.dots i.on{background:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.catrow{display:grid;grid-template-columns:110px 1fr 44px;align-items:center;gap:10px;font-size:14px;font-weight:600}
.catrow em{font-style:normal;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.end{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.end .lb{width:96px;height:96px;animation:spin 1.2s ease-out}
@keyframes spin{from{transform:rotate(-180deg) scale(.4)}}
.end h2{font-size:34px}
.small-link{color:var(--accent);font-weight:700;font-size:14px;padding:6px 0;text-align:left}
.snd{color:var(--muted);padding:6px 8px}
.mode.champ{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-deep) 100%)}
.mode.champ .ic{color:var(--gold);background:rgba(0,0,0,.18)}
.rec{font-family:var(--display);font-weight:600;opacity:1!important;color:var(--gold)!important;font-size:15px!important;margin-top:4px}
.mode.daily .ic{color:var(--gold)}
.mode.daily.done .ic{background:var(--good-soft);color:var(--accent)}
.powers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pw{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-radius:12px;background:var(--surface);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:13px}
.pw svg{width:18px;height:18px;color:var(--accent)}
.pw em{font-style:normal;font-size:11px;color:var(--muted);background:var(--surface2);border-radius:999px;padding:1px 6px}
.pw:disabled{opacity:.4}
#pw-freeze svg{color:#3a9ad9}
.score{display:flex;flex-direction:column;align-items:center;line-height:1}
.score b{font-family:var(--display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.score span{font-size:11px;color:var(--muted);font-weight:600}
.mult{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--gold);color:#1d1400;font-weight:700;animation:bump .3s}
.mult.m3{background:#f08a2f}.mult.m4{background:var(--red);color:#fff}
@keyframes bump{50%{transform:scale(1.3)}}
.inp.good{border-color:var(--accent);background:var(--good-soft)}
.inp.wrong{border-color:var(--red);background:var(--red-soft);animation:shake .35s}
.pop-in{animation:popin .3s ease-out}
@keyframes popin{from{transform:scale(.6);opacity:0}}
.clock.ice,.tbar>i.ice{color:#3a9ad9;background:#3a9ad9}
.clock.ice{background:none}
.prompt{position:relative}
.pop{position:absolute;left:50%;top:30%;transform:translateX(-50%);font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent);pointer-events:none;animation:float 1s ease-out forwards}
.pop.hot{color:var(--gold);font-size:38px}
@keyframes float{to{transform:translate(-50%,-70px);opacity:0}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:30;background:var(--ink);color:var(--bg);font-family:var(--display);font-size:28px;font-weight:700;padding:16px 26px;border-radius:20px;text-align:center;animation:bannr 1.5s ease-out forwards;pointer-events:none;max-width:90%}
.banner small{display:block;font-size:15px;opacity:.75}
@keyframes bannr{0%{transform:translate(-50%,-50%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.medal-toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:12px;background:var(--surface);border:3px solid var(--gold);border-radius:18px;padding:10px 18px;box-shadow:0 6px 0 var(--line);animation:drop 2.6s ease-out forwards;max-width:calc(100% - 32px)}
.medal-toast svg{width:36px;height:36px;color:var(--gold);flex:none}
.medal-toast small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.medal-toast b{font-family:var(--display);font-size:20px;font-weight:600}
@keyframes drop{0%{transform:translate(-50%,-120%)}12%{transform:translate(-50%,0)}85%{transform:translate(-50%,0);opacity:1}100%{transform:translate(-50%,-120%);opacity:0}}
.sheet.slim{padding:12px 16px;gap:6px}
.sheet.slim h3{font-size:20px}
.medals{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.medal{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:10px 6px;border-radius:14px;background:var(--surface2);opacity:.55}
.medal svg{width:34px;height:34px;color:var(--muted)}
.medal b{font-size:13px}
.medal span{font-size:11px;color:var(--muted);line-height:1.3}
.medal.on{opacity:1;background:var(--good-soft)}
.medal.on svg{color:var(--gold)}
.review{border-radius:16px;background:var(--surface2);padding:14px;display:flex;flex-direction:column;gap:10px}
.review .fix{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.review s{color:var(--red)}
.review ins{text-decoration:none;font-weight:700;color:var(--accent)}
.review p{margin:0;font-size:14px;line-height:1.45}
.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--ink);font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.esprog{font-size:12px;color:var(--muted);font-weight:700;display:flex;align-items:center;justify-content:center;gap:4px;margin-top:2px}
.esprog svg{width:14px;height:14px}
.bonus{position:fixed;inset:0;z-index:35;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto;animation:popin .3s ease-out}
.bonus-in{width:100%;max-width:448px;display:flex;flex-direction:column;gap:14px;background:var(--surface);border:3px solid var(--gold);border-radius:24px;padding:20px 16px;box-shadow:0 6px 0 var(--line)}
.bonus-tag{align-self:center;display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:#1d1400;font-family:var(--display);font-weight:700;font-size:18px;padding:6px 16px;border-radius:999px}
.bonus-tag svg{width:18px;height:18px}
.bonus .q{font-size:clamp(22px,6.4vw,28px);line-height:1.25;overflow-wrap:anywhere}
.lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{padding:7px 0;border-radius:10px;background:var(--surface2);font-weight:700;font-size:13px;color:var(--muted)}
.lv.done{color:var(--accent)}
.lv.cur{background:var(--accent);color:var(--accent-ink)}
.lvlup{width:100%;border:3px solid var(--gold);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;background:var(--surface);animation:popin .4s ease-out}
.lvlup small{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.lvlup b{font-family:var(--display);font-size:26px;font-weight:700;color:var(--accent)}
.lvlup span{font-size:14px;color:var(--muted)}
.newday{display:flex;align-items:center;gap:12px;text-align:left;background:var(--surface);border:3px solid var(--gold);border-radius:20px;padding:14px 16px;box-shadow:0 4px 0 var(--line)}
.newday div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.newday b{font-family:var(--display);font-size:20px;font-weight:600}
.newday span{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.newday em{font-style:normal;font-weight:700;background:var(--gold);color:#1d1400;border-radius:999px;padding:8px 14px;font-family:var(--display)}
.expl{margin:0;padding:10px 12px;border-radius:12px;background:var(--surface);font-size:14px;line-height:1.45}
.expl b{color:var(--accent);margin-right:4px}
.right-ans{display:block;font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.big.wait{position:relative;overflow:hidden;opacity:1}
.big.wait::after{content:"";position:absolute;left:0;top:0;bottom:0;width:100%;background:rgba(255,255,255,.28);transform-origin:left;animation:waitbar var(--wait,3500ms) linear forwards}
@keyframes waitbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.bonus-in.verb{border-color:var(--accent)}
.bonus-tag.vt{background:var(--accent);color:var(--accent-ink)}
.letter{font-weight:700;color:var(--muted);margin-right:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const BASE_ESAERAK = [
  ["Ezina ekinez egina","Lo imposible se consigue insistiendo.","ekinez"],

/* Zailtasun-maila: 1=A1 … 5=C1 */
const MAILA_NAMES=["","A1 · Hasiera","A2 · Oinarria","B1 · Erdi-maila","B2 · Aurreratua","C1 · Gaitasuna"];
const LVL={};
[[1,"sukaldea logela komuna leihoa atea giltza ohea mahaia etxea aulkia mendia euria elurra haizea zuhaitza itsasoa poza ikasi eskatu polita zaila erraza ogia gazta sagarra arrautza esnea ura ardoa atzo bihar astea goiza gaua eguna garbia zikina"],
 [2,"teilatua eskailerak ispilua ibaia hodeia hondartza basoa hostoa tristura beldurra haserrea maitasuna mina ahaztu gogoratu aurkitu galdu itxaron lagundu ulertu utzi lasaia urduria astuna arina haragia arraina babarrunak gatza garagardoa etzi herenegun hilabetea arratsaldea beraz gainera oraindik"],
 [3,"ekaitza lainoa tximista lotsa harrotasuna zoriona irakatsi saiatu lortu erabaki konpondu azkarra alferra zintzoa apala harroa egunsentia ilunabarra behintzat bestela berriz izan_ere hala_ere"],
 [4,"errukia ezinegona irrika garatu baieztatu ukatu onartu saihestu iradoki nabarmendu harritu nekatuta zuhurra ausarta lotsatia berehala nahiz_eta bestalde hots ohitura gertakaria ondorioa arrazoia baldintza eztabaida aukera helburua jarrera iritzia"],
 [5,"zehaztu aldarrikatu gauzatu bultzatu ezkutatu egiaztatu zorrotza xumea arduratsua maltzurra ezinbestekoa nolanahi_ere alabaina are_gehiago horrenbestez zalantza konponbidea aurrekaria ahalegina atsekabea lehia oinarria begirunea"]
].forEach(([l,str])=>str.split(" ").forEach(w=>LVL[w.replace(/_/g," ")]=l));
const ES_LVL=[4,3,4,4,3,2,3,3,4,5,3,2,1,1,4,4,2,2,3,4,5];
const DEFAULT_ITEMS = [];
for (const [cat, list] of Object.entries(BASE_WORDS)) list.forEach(([eu,es],i)=>DEFAULT_ITEMS.push({id:"b-"+cat+"-"+i,eu,es,cat,type:"word",maila:LVL[alts(eu)[0]]||(eu.startsWith("dagoeneko")||eu.startsWith("agian")?2:2)}));
BASE_ESAERAK.forEach(([eu,es,gap],i)=>DEFAULT_ITEMS.push({id:"e-"+i,eu,es,cat:"Esaerak",type:"esaera",gap,maila:ES_LVL[i]||3}));

/* ---------- ESTADO ---------- */
const KEY="hitzjoko-v1";
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.prog)return s}catch(e){}return null}
let S = load() || {mine:[],prog:{},xp:0,streak:0,lastDay:null,dir:"eu",cat:"all",best:0};
S.stats=S.stats||{};S.lvl=S.lvl||1;S.medals=S.medals||{};if(S.sound===undefined)S.sound=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let DAILY=[], DBX=null; /* DAILY se llena desde el banco local */
const items=()=>DEFAULT_ITEMS.concat(DAILY,S.mine);
const words=()=>items().filter(i=>i.type==="word");
const esaerak=()=>items().filter(i=>i.type==="esaera");
const P=id=>S.prog[id]||(S.prog[id]={box:0,r:0,w:0});
const today=()=>new Date().toISOString().slice(0,10);
function touchStreak(){
  const t=today(); if(S.lastDay===t) return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = S.lastDay===y ? S.streak+1 : 1; S.lastDay=t;
}
function mark(it,ok){const p=P(it.id); p.ok=ok; if(ok){p.r++;p.box=Math.min(5,p.box+1)} else {p.w++;p.box=Math.max(0,p.box-2)} p.last=Date.now()}
const level=xp=>{let l=1,need=100,acc=0;while(xp>=acc+need){acc+=need;l++;need=Math.round(need*1.25)}return{l,cur:xp-acc,need}};
const LEVEL_NAMES=["Hasiberria","Ikaslea","Hiztuna","Bertsolari gaztea","Euskalduna","Hizkuntz maisua"];

/* ---------- UTIL ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ic=(n,c="")=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zñ0-9 ]/g,"").replace(/\s+/g," ").trim();
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
function pool(type){
  let list = (type==="esaera"?esaerak():words()).filter(i=>i.mine||i.day||(i.maila||1)<=S.lvl+(type==="esaera"?1:0));
  if(type!=="esaera"){
    if(S.cat==="mine") list=list.filter(i=>i.mine);
    else if(S.cat==="today") list=list.filter(i=>i.day===today());
    else if(S.cat==="daily") list=list.filter(i=>i.day);
    else if(S.cat!=="all") list=list.filter(i=>i.cat===S.cat);
  }
  return list;
}
/* repetición espaciada: priorizar cajas bajas */
/* Solo se repiten las falladas: falladas primero, luego nuevas; las acertadas solo si no queda nada */
function status(it){const p=S.prog[it.id];if(!p||p.r+p.w===0)return"new";const ok=p.ok!==undefined?p.ok:p.box>=1;return ok?"ok":"fail"}
function pick(list,n){
  const fails=shuffle(list.filter(i=>status(i)==="fail")), fresh=shuffle(list.filter(i=>status(i)==="new")).sort((a,b)=>(b.maila||0)-(a.maila||0));
  let out=fails.slice(0,Math.ceil(n*.6)).concat(fresh).concat(fails.slice(Math.ceil(n*.6))).slice(0,n);
  if(out.length<n){const done=list.filter(i=>status(i)==="ok").sort((a,b)=>(P(a.id).last||0)-(P(b.id).last||0));out=out.concat(done.slice(0,n-out.length))}
  return shuffle(out);
}
function pending(list){return{fail:list.filter(i=>status(i)==="fail").length,fresh:list.filter(i=>status(i)==="new").length}}

}

  const L=level(S.xp);

function award(ok,it){

function qQuiz(){

/* ---- significados múltiples ---- */
const ART=/^(el|la|los|las|lo|un|una|unos|unas)\s+/;
const keyEs=s=>norm(s).replace(ART,"");
const keyEu=s=>norm(s);
function euEq(a,b){a=keyEu(a);b=keyEu(b);return a===b||a+"a"===b||a===b+"a"||a+"ak"===b||a===b+"ak"}
function esEq(a,b){return keyEs(a)===keyEs(b)}
function lev(a,b){const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
/* todas las respuestas válidas: incluye otras palabras que comparten significado */
function accepted(it,toEs){
  const all=words();
  if(toEs){const E=alts(it.eu);return [...new Set(all.filter(w=>alts(w.eu).some(x=>E.some(e=>euEq(x,e)))).flatMap(w=>alts(w.es)))]}
  const M=alts(it.es);return [...new Set(all.filter(w=>alts(w.es).some(x=>M.some(m=>esEq(x,m)))).flatMap(w=>alts(w.eu)))]
}
const sharesMeaning=(a,b)=>alts(a.es).some(x=>alts(b.es).some(y=>esEq(x,y)))||alts(a.eu).some(x=>alts(b.eu).some(y=>euEq(x,y)));
function check(input,list,toEs){
  const eq=toEs?esEq:euEq; const hit=list.find(a=>eq(input,a)); if(hit) return {ok:true,hit,typo:false};
  const k=toEs?keyEs:keyEu; const v=k(input);
  const near=list.find(a=>{const t=k(a);return t.length>=5&&lev(v,t)<=1});
  return near?{ok:true,hit:near,typo:true}:{ok:false};
}
let timerRAF=null;
/* ---------- SONIDO Y EFECTOS ---------- */
let AC=null;
function beep(notes,type="sine",vol=.12){
  if(S.sound===false) return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();
    let t=AC.currentTime;
    notes.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.8});
  }catch(e){}
}
const SFX={
  ok:()=>beep([[660,.09],[990,.16]],"triangle"),
  bad:()=>beep([[180,.22]],"square",.06),
  tick:()=>beep([[1200,.04]],"sine",.05),
  up:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.25]],"triangle"),
  freeze:()=>beep([[1500,.08],[1800,.08],[2100,.14]],"sine",.07)
};
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
const RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(n=90){
  if(RM) return;
  const c=document.createElement("canvas");c.className="fx";document.body.appendChild(c);
  const x=c.getContext("2d"),W=c.width=innerWidth*devicePixelRatio,H=c.height=innerHeight*devicePixelRatio;
  const cs=getComputedStyle(document.documentElement);
  const cols=["--accent","--gold","--red","--ink"].map(v=>cs.getPropertyValue(v).trim());
  const ps=Array.from({length:n},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.45,vx:(Math.random()-.5)*W*.022,vy:-Math.random()*H*.022-H*.006,r:Math.random()*Math.PI,s:(6+Math.random()*7)*devicePixelRatio,c:cols[Math.random()*4|0]}));
  const t0=performance.now();
  (function f(now){x.clearRect(0,0,W,H);ps.forEach(p=>{p.vy+=H*.0007;p.x+=p.vx;p.y+=p.vy;p.r+=.2;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(now-t0<2600)requestAnimationFrame(f);else c.remove()})(t0);
}

function seeded(seed){let h=1779033703^seed.length;for(let i=0;i<seed.length;i++){h=Math.imul(h^seed.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296}}

}

  if(!el) return;
  const show=t=>{el.hidden=false;el.innerHTML=`<b>Azalpena</b> ${esc(t)}`};

const AUX_TR={pres:{ni:["dut","ditut"],zu:["duzu","dituzu"],hura:["du","ditu"],gu:["dugu","ditugu"],haiek:["dute","dituzte"]},
              past:{ni:["nuen","nituen"],zu:["zenuen","zenituen"],hura:["zuen","zituen"],gu:["genuen","genituen"],haiek:["zuten","zituzten"]}};
const AUX_IN={pres:{ni:"naiz",zu:"zara",hura:"da",gu:"gara",haiek:"dira"},past:{ni:"nintzen",zu:"zinen",hura:"zen",gu:"ginen",haiek:"ziren"}};
const SUBJ_ES={ni:"yo",zu:"tú",hura:"él / ella",gu:"nosotros",haiek:"ellos"};
const TDESC={perf:"Es pretérito perfecto: participio + auxiliar en presente.",past:"Es pasado: participio + auxiliar en pasado.",hab:"Es presente habitual: forma en -t(z)en + auxiliar en presente.",fut:"Es futuro: participio con -ko / -go + auxiliar en presente."};
const vkey=it=>{const k=alts(it.eu)[0];return VT[k]&&VFORMS[k]?k:null};
const hasVT=it=>it&&it.type==="word"&&!!vkey(it);
function vSentence(k,pre,subj,obj,t,auxType){
  const [imp,fut]=VFORMS[k]; const vf=t==="hab"?imp:t==="fut"?fut:k;
  const tt=t==="past"?"past":"pres";
  const aux=auxType==="tr"?AUX_TR[tt][subj][obj==="pl"?1:0]:AUX_IN[tt][subj];
  const txt=(pre?pre+" ":"")+vf+" "+aux+".";
  return {txt:txt.charAt(0).toUpperCase()+txt.slice(1),aux};
}
function buildVT(it){
  const k=vkey(it); if(!k) return null;
  const list=VT[k]; S.vtIdx=S.vtIdx||{}; const n=(S.vtIdx[k]||0)%list.length; S.vtIdx[k]=n+1;
  const [es,pre,subj,obj,t]=list[n]; const at=VFORMS[k][2];
  const right=vSentence(k,pre,subj,obj,t,at);
  const other={ni:"gu",gu:"ni",hura:"haiek",haiek:"hura",zu:"ni"}[subj];
  const swapT={perf:"past",past:"perf",hab:"perf",fut:"hab"}[t];
  const c=[vSentence(k,pre,subj,obj,swapT,at).txt];
  if(at==="tr"){c.push(vSentence(k,pre,subj,obj==="pl"?"sg":"pl",t,at).txt);c.push(vSentence(k,pre,other,obj,t,at).txt)}
  else{c.push(vSentence(k,pre,other,"",t,at).txt);c.push(vSentence(k,pre,subj,"sg",t,"tr").txt)}
  c.push(vSentence(k,pre,subj,obj,t==="fut"?"past":"fut",at).txt);
  const wrong=[...new Set(c)].filter(x=>x!==right.txt).slice(0,3);
  const az=TDESC[t]+" "+(at==="tr"
    ?`Lleva el auxiliar ukan (${right.aux}) porque el sujeto (${SUBJ_ES[subj]}) actúa sobre algo${obj==="pl"?"; el objeto es plural, por eso lleva -it-":""}.`
    :`Lleva el auxiliar izan (${right.aux}) porque el verbo es intransitivo; sujeto: ${SUBJ_ES[subj]}.`);
  return {es,opts:[right.txt,...wrong],ok:0,azalpena:az};
}

/* ---------- REVISIÓN ORTOGRÁFICA LOCAL (norma del batua, sin IA) ---------- */
function lintEu(word){
  const w=String(word); const notes=[]; let fix=w;
  const rep=(re,to,msg)=>{if(re.test(fix)){fix=fix.replace(re,to);if(!notes.includes(msg))notes.push(msg)}};
  rep(/[áéíóú]/gi,m=>({á:"a",é:"e",í:"i",ó:"o",ú:"u",Á:"A",É:"E",Í:"I",Ó:"O",Ú:"U"}[m]),"En euskera batua no se usan tildes.");
  rep(/ch/gi,m=>m[0]==="C"?"Tx":"tx","El sonido «ch» se escribe tx.");
  rep(/qu/gi,m=>m[0]==="Q"?"K":"k","«qu» se escribe k.");
  rep(/c(?=[ei])/gi,m=>m==="C"?"Z":"z","«ce, ci» se escriben ze, zi.");
  rep(/c/gi,m=>m==="C"?"K":"k","La c se escribe k.");
  if(/ll/i.test(fix)) notes.push("La «ll» no se usa en batua: según la palabra, se escribe il o l. Revisa la forma en el diccionario.");
  rep(/v/gi,m=>m==="V"?"B":"b","La v se escribe b.");
  rep(/y/gi,m=>m==="Y"?"I":"i","La y se escribe i.");
  rep(/w/gi,m=>m==="W"?"U":"u","La w no se usa en palabras vascas.");
  return {fix,notes};
}
function localReview(list,box,commit){
  const known=items().filter(i=>i.type==="word");
  const res=list.map(x=>{
    const {fix,notes}=x.type==="word"?lintEu(x.eu):{fix:x.eu,notes:[]};
    const k=alts(fix)[0]; let dup=null, near=null;
    if(x.type==="word"){
      dup=known.find(i=>alts(i.eu).some(a=>euEq(a,k)));
      if(!dup) near=known.find(i=>alts(i.eu).some(a=>{const A=keyEu(a),B=keyEu(k);return B.length>=4&&lev(A,B)===1}));
    }
    return {...x,fix,notes,dup,near};
  });
  const flagged=res.filter(r=>r.notes.length||r.dup||r.near);
  if(!flagged.length){commit(list,list.length>1?`${list.length} gehituta`:`Gehituta: ${list[0].eu}`);return}
  box.hidden=false;
  box.innerHTML=flagged.map(r=>`<div class="review">
     ${r.notes.length?`<div class="fix"><s>${esc(r.eu)}</s> → <ins>${esc(r.fix)}</ins></div><p>${esc(r.notes.join(" "))}</p>`:""}
     ${r.dup?`<p><b>Ya la tienes:</b> ${esc(r.dup.eu)} = ${esc(r.dup.es)}. No se añadirá dos veces.</p>`:""}
     ${r.near?`<p><b>¿Querías decir</b> ${esc(r.near.eu)} (${esc(r.near.es)})?</p>`:""}
   </div>`).join("")+`
   <div class="row2"><button type="button" class="big ghost" id="rv-mine">Gorde nirea</button><button type="button" class="big" id="rv-ok">Gorde zuzenduta</button></div>
   <p class="sub" style="margin:0">Revisión ortográfica automática. Si dudas, consulta <a href="https://www.euskaltzaindia.eus/hiztegibatua" target="_blank" rel="noopener" style="color:var(--accent)">el Hiztegi Batua de Euskaltzaindia</a>.</p>`;
  $("#rv-ok").onclick=()=>{const keep=res.filter(r=>!r.dup).map(r=>({...r,eu:r.fix}));if(keep.length)commit(keep,`Gordeta: ${keep.length}`);else{box.hidden=true;toast("Ya las tenías todas")}};
  $("#rv-mine").onclick=()=>{const keep=res.filter(r=>!r.dup);if(keep.length)commit(keep,`Gordeta: ${keep.length}`);else{box.hidden=true;toast("Ya las tenías todas")}};
}

  <button class="big ${pendingReset?"danger":"ghost"}" id="reset">${pendingReset?"Toca otra vez para borrar el progreso":"Reiniciar progreso"}</button>
  <p class="sub" style="margin:0;text-align:center">Tus palabras y progreso se guardan en este dispositivo.</p>`;
  $("#reset").onclick=()=>{if(!pendingReset){pendingReset=true;renderProg();setTimeout(()=>{if(pendingReset){pendingReset=false;if(tab==="prog")renderProg()}},3000);return}
    S.prog={};S.xp=0;S.streak=0;S.best=0;S.lastDay=null;S.stats={};S.medals={};S.survBest=0;S.daily={};pendingReset=false;save();toast("Progreso reiniciado");renderProg()};
}

/* Botón «atrás» de Android: cierra la partida o vuelve al inicio */
window.hjBack=()=>{ if(G){closeGame();return true} if(tab!=="home"){tab="home";render();window.scrollTo(0,0);return true} return false };
ensureDaily();
render();
</script>
